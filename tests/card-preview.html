<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaterHA card preview</title>
<style>
  body { font-family: Roboto, system-ui, sans-serif; font-size: 14px; background: #f5f5f5; margin: 0; padding: 16px;
         --primary-color: #039be5; --secondary-text-color: #727272; --primary-text-color: #212121;
         --divider-color: #e0e0e0; --card-background-color: #fff; --text-primary-color: #fff; }
  ha-card { display: block; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.15);
            max-width: var(--w, 600px); }
</style>
</head>
<body>
<waterha-run-card id="run" style="display:block;max-width:620px;margin-bottom:12px"></waterha-run-card>
<waterha-card id="card"></waterha-card>
<pre id="log"></pre>
<script>
// Stand-in for HA's ha-icon: a dot the size HA draws, so widths match a real dashboard.
customElements.define("ha-icon", class extends HTMLElement {
  connectedCallback() {
    this.style.cssText = "display:inline-block;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);border-radius:50%;background:#9e9e9e";
  }
});
</script>
<script src="../custom_components/waterha/frontend/waterha-card.js"></script>
<script>
// A fake hass with one tap, enough to click through the card.
const now = Date.now();
const hours = Array.from({ length: 49 }, (_, i) => ({
  t: new Date(now + (i - 24) * 3600000).toISOString(),
  mm: [0, 0, 0.4, 1.2, 0.2][i % 5] * (i > 30 ? 1 : 0.3),
  p: 60,
}));
const states = {
  "sensor.rain": { entity_id: "sensor.rain", state: "2.5", last_updated: "1", attributes: {
    waterha: "rain", hours, past_24h: 1.3, next_24h: 1.2, source: "Open-Meteo", updated: new Date().toISOString(),
    day_type: "hot", day_type_by: "evapotranspiration", temp_max_today: 21.4, cool_below: 16, hot_from: 23,
    et_today: 5.8, et_cool_below: 3, et_hot_from: 5,
    et_cool_below_entity: "number.et_cool", et_hot_from_entity: "number.et_hot",
    cool_below_entity: "number.cool_below", hot_from_entity: "number.hot_from",
    taps: [{ id: "t1", name: "Lawn", status: "sensor.lawn_status", next_run: "sensor.lawn_next_run",
      automatic: "switch.lawn_auto", one_at_a_time: "switch.lawn_seq", amount_cool: "number.lawn_cool",
      amount_warm: "number.lawn_warm", amount_hot: "number.lawn_hot", rain_threshold: "number.lawn_thr",
      start_time: "time.lawn_start", start_time_2: "time.lawn_start2", slot_1: "switch.lawn_s1", slot_2: "switch.lawn_s2",
      slot_1_when: "select.lawn_w1", slot_2_when: "select.lawn_w2", slot_1_share: "number.lawn_p1", slot_2_share: "number.lawn_p2", water_now: "button.lawn_water", stop: "button.lawn_stop" }] } },
  "sensor.lawn_status": { state: "idle", last_updated: "1", attributes: { mode: "minutes", start_time: "06:00:00",
    day_type: "hot", amount_today: 15, rain_factor: 0.5, scheduled_amount: 7.5,
    days: ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
    slot_plan: [{ slot: 1, on: true, when: "always", share: 100, runs_today: true, amount: 7.5 },
                { slot: 2, on: true, when: "hot", share: 30, runs_today: true, amount: 2.3 }],
    next_run: new Date(now + 86400000).toISOString(), last_result: "completed", last_run: new Date(now - 86400000).toISOString(), last_minutes: 10 } },
  "switch.lawn_auto": { state: "on", last_updated: "1", attributes: {} },
  "switch.lawn_seq": { state: "on", last_updated: "1", attributes: {} },
  "number.lawn_cool": { state: "5.0", last_updated: "1", attributes: { min: 0, max: 240, step: 1 } },
  "number.lawn_warm": { state: "10.0", last_updated: "1", attributes: { min: 0, max: 240, step: 1 } },
  "number.lawn_hot": { state: "15.0", last_updated: "1", attributes: { min: 0, max: 240, step: 1 } },
  "number.cool_below": { state: "16.0", last_updated: "1", attributes: { min: -10, max: 50, step: 0.5 } },
  "number.hot_from": { state: "23.0", last_updated: "1", attributes: { min: -10, max: 50, step: 0.5 } },
  "number.lawn_thr": { state: "5.0", last_updated: "1", attributes: { min: 0, max: 200, step: 0.5 } },
  "time.lawn_start": { state: "06:00:00", last_updated: "1", attributes: {} },
  "time.lawn_start2": { state: "16:00:00", last_updated: "1", attributes: {} },
  "switch.lawn_s1": { state: "on", last_updated: "1", attributes: {} },
  "select.lawn_w1": { state: "always", last_updated: "1", attributes: {} },
  "select.lawn_w2": { state: "hot", last_updated: "1", attributes: {} },
  "number.lawn_p1": { state: "100", last_updated: "1", attributes: { min: 5, max: 100, step: 5 } },
  "number.lawn_p2": { state: "30", last_updated: "1", attributes: { min: 5, max: 100, step: 5 } },
  "number.et_cool": { state: "3.0", last_updated: "1", attributes: { min: 0, max: 15, step: 0.5 } },
  "number.et_hot": { state: "5.0", last_updated: "1", attributes: { min: 0, max: 15, step: 0.5 } },
  "switch.lawn_s2": { state: "on", last_updated: "1", attributes: {} },
};
let n = 2;
const card = document.getElementById("card");
window.calls = [];
function push() {
  card.hass = { states: { ...states }, callService };
  const run = document.getElementById("run"); if (!run._config) run.setConfig({}); run.hass = { states: { ...states }, callService };
}
function callService(domain, service, data) {
  window.calls.push([domain, service, data]);
  document.getElementById("log").textContent = JSON.stringify(window.calls, null, 1);
  if (domain === "switch") {
    states[data.entity_id] = { ...states[data.entity_id], state: service === "turn_on" ? "on" : "off", last_updated: String(n++) };
    setTimeout(push, 50);
  }
  if (domain === "number") {
    states[data.entity_id] = { ...states[data.entity_id], state: String(data.value), last_updated: String(n++) };
    setTimeout(push, 50);
  }
}
card.setConfig({ title: "Garden watering" });
push();
</script>
</body>
</html>
