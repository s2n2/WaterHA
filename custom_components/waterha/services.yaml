water_now:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: true
    amount:
      selector:
        number:
          min: 0.1
          max: 2000
          step: 0.5
          mode: box
    mode:
      selector:
        select:
          options:
            - minutes
            - litres
          translation_key: mode
stop:
  fields:
    entity_id:
      selector:
        entity:
          multiple: true
refresh_rain:
